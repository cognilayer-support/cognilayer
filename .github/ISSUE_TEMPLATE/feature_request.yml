---
name: Feature Request
description: Neues Feature oder Verbesserung vorschlagen
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Danke für deinen Vorschlag! Die automatische Pipeline prüft die Umsetzbarkeit."
  - type: input
    id: repo
    attributes:
      label: Betroffenes Repository
      placeholder: z.B. cognilayer-portal, cognilayer-platform-api
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
      description: Wie sollte die Lösung aussehen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Gibt es alternative Ansätze?